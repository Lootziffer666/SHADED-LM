name: Web CI

on:
  push:
    branches:
      - feat/mobile-3d-asset-library-core
    paths:
      - 'src/**'
      - 'package.json'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - 'vitest.config.ts'
      - 'capacitor.config.ts'
      - 'index.html'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'package.json'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - 'vitest.config.ts'
      - 'capacitor.config.ts'
      - 'index.html'
      - '.github/workflows/ci.yml'

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-node24-${{ hashFiles('package.json') }}
      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm install --prefer-offline --no-audit --no-fund
      - run: npm test -- src/domain/library.test.ts
      - run: npm test
      - run: npm run build
