name: CI
on:
  push:
    branches: ['feat/mobile-library-v1']
  pull_request:
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Test
        shell: bash
        run: set -o pipefail; npm test 2>&1 | tee test.log
      - name: Build
        if: always()
        shell: bash
        run: set -o pipefail; npm run build 2>&1 | tee build.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics-${{ github.run_id }}
          path: |
            test.log
            build.log
          if-no-files-found: ignore
