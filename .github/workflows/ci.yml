name: CI
on:
  push:
    branches: ['feat/mobile-library-v1']
  pull_request:
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Test
        shell: bash
        run: set -o pipefail; npm test 2>&1 | tee test.log
      - name: Build
        if: always()
        shell: bash
        run: set -o pipefail; npm run build 2>&1 | tee build.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics-${{ github.run_id }}
          path: |
            test.log
            build.log
          if-no-files-found: ignore
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install
      - run: npm run build
      - run: npm run android:prepare
      - name: Native tests and APK
        shell: bash
        run: cd android && chmod +x gradlew && set -o pipefail; ./gradlew test assembleDebug 2>&1 | tee ../android-test.log
      - name: Upload Android APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SHADED-LM-debug-${{ github.run_id }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload Android diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-diagnostics-${{ github.run_id }}
          path: android-test.log
          if-no-files-found: ignore
